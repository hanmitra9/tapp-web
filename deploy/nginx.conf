# TAPP on a VPS with Nginx — one site: landing, signed-in pages and admin on one domain.
# Build: python3 site/tools/build_all.py https://tapp.example  → copy dist/ to /var/www/tapp
# Replace tapp.example with your domain; get a certificate with certbot.

server {
  listen 80;
  server_name tapp.example www.tapp.example;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name tapp.example www.tapp.example;
  ssl_certificate     /etc/letsencrypt/live/tapp.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tapp.example/privkey.pem;
  root /var/www/tapp;
  index index.html;

  # Admin panel (single-page app under /admin/)
  location /admin/ { try_files $uri $uri/ /admin/index.html; add_header X-Frame-Options DENY always; }

  # Landing pages with clean URLs (/privacy, /campaigns); everything else is a signed-in page of the web app.
  location / { try_files $uri $uri.html $uri/ /app.html; }

  location ~ ^/(index|app)\.html$ { add_header Cache-Control "no-cache"; }
  location = /assets/config.js { add_header Cache-Control "no-cache"; }
  location ~ ^/(assets|_expo|fonts)/ { add_header Cache-Control "public, max-age=604800"; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
}
