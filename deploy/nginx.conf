# TAPP on a VPS with Nginx — three subdomains (Option A in DEPLOY.md).
# Replace tapp.example with your domain; get certificates with certbot.

server {
  listen 80;
  server_name tapp.example www.tapp.example app.tapp.example admin.tapp.example;
  return 301 https://$host$request_uri;
}

# Website — static pages with clean URLs (/privacy, /terms, /campaigns)
server {
  listen 443 ssl http2;
  server_name tapp.example www.tapp.example;
  ssl_certificate     /etc/letsencrypt/live/tapp.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tapp.example/privkey.pem;
  root /var/www/tapp/site;
  index index.html;
  error_page 404 /404.html;
  location ~ ^/(src|tools)(/|$) { return 404; }
  location / { try_files $uri $uri.html $uri/ =404; }
  location = /assets/config.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=604800"; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Web app — single-page app
server {
  listen 443 ssl http2;
  server_name app.tapp.example;
  ssl_certificate     /etc/letsencrypt/live/tapp.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tapp.example/privkey.pem;
  root /var/www/tapp/app;
  location / { try_files $uri $uri/ /index.html; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
}

# Admin panel — single-page app (consider restricting by IP or basic auth on top of the login)
server {
  listen 443 ssl http2;
  server_name admin.tapp.example;
  ssl_certificate     /etc/letsencrypt/live/tapp.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tapp.example/privkey.pem;
  root /var/www/tapp/admin;
  location / { try_files $uri $uri/ /index.html; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
}
